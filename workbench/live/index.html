<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgentSkills Live Audit</title>
  <style>
    .asw-live { --primary:#12324A; --primary-active:#0B2538; --accent:#2F7D68; --accent-soft:#DDF2EA;
      --canvas:#F6F8FA; --surface:#fff; --surface-soft:#EEF3F7; --ink:#17202A; --body:#344054;
      --muted:#667085; --border:#D8E0E7; --s0:#7A1E1E; --s1:#B42318; --s2:#92400E; --s3:#3B5B73; --s4:#475467;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--canvas);
      min-height: 100vh; margin: 0; font-size: 14px; line-height: 1.5;
    }
    .asw-live * { box-sizing: border-box; }
    .asw-live header { background: var(--primary); color: #fff; padding: 16px 24px; }
    .asw-live header h1 { margin: 0 0 8px; font-size: 20px; font-weight: 650; }
    .asw-live header .meta { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; opacity: .92; }
    .asw-live .progress-bar { height: 6px; background: rgba(255,255,255,.2); border-radius: 99px; margin-top: 12px; overflow: hidden; }
    .asw-live .progress-fill { height: 100%; background: var(--accent); transition: width .4s ease; }
    .asw-live main.split-main { display: grid; grid-template-columns: 268px 1fr 300px; gap: 0; min-height: calc(100vh - 220px); }
    @media (max-width: 1100px) { .asw-live main.split-main { grid-template-columns: 1fr; } }
    .asw-live aside, .asw-live .rail-right { padding: 16px; border-right: 1px solid var(--border); background: var(--surface); overflow-y: auto; max-height: calc(100vh - 220px); }
    .asw-live .rail-right { border-right: none; background: var(--surface-soft); }
    .asw-live .center-site { display: flex; flex-direction: column; background: #0f1720; min-height: calc(100vh - 220px); border-right: 1px solid var(--border); position: relative; }
    .asw-live .caption-bar { background: var(--primary); color: #fff; padding: 14px 18px; flex-shrink: 0; border-bottom: 3px solid var(--accent); }
    .asw-live .caption-bar strong { display: block; font-size: 11px; opacity: .8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
    .asw-live .caption-bar .caption-text { font-size: 15px; line-height: 1.5; }
    .asw-live .caption-bar.snapshot { border-bottom-color: #92400e; }
    .asw-live .center-site iframe { flex: 1; width: 100%; min-height: 360px; border: 0; background: #fff; }
    .asw-live .site-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; color: #94a3b8; text-align: center; font-size: 14px; line-height: 1.6; }
    .asw-live h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
    /* 阶段流水线：节点 + 竖向连线 */
    .asw-live .flow-pipeline { display: flex; flex-direction: column; padding: 4px 0 12px; }
    .asw-live .flow-step-wrap { display: flex; flex-direction: column; }
    .asw-live .flow-node { display: flex; align-items: flex-start; gap: 10px; padding: 2px 0; background: transparent; position: relative; }
    .asw-live .flow-node.active .node-label strong { color: var(--primary); }
    .asw-live .flow-node.pending { opacity: .5; }
    .asw-live .flow-node .node-circle {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; border: 2px solid var(--border); background: transparent;
      color: var(--muted);
    }
    .asw-live .flow-node.done .node-circle { border-color: var(--accent); background: var(--accent); color: #fff; }
    .asw-live .flow-node.running .node-circle { border-color: var(--primary); background: var(--primary); color: #fff; animation: pulse 1.2s infinite; }
    .asw-live .flow-node.skipped .node-circle { border-color: var(--s2); background: #fff8eb; color: var(--s2); }
    .asw-live .flow-node.blocked .node-circle { border-color: var(--s1); background: #fef3f2; color: var(--s1); }
    .asw-live .flow-node .node-label { flex: 1; min-width: 0; }
    .asw-live .flow-node .node-label strong { display: block; font-size: 12px; line-height: 1.35; }
    .asw-live .flow-connector {
      width: 2px; height: 16px; margin: 2px 0 2px 10px; border-radius: 1px;
      background: var(--border);
    }
    .asw-live .url-toast { font-size: 12px; color: var(--accent); margin: 0 24px 8px; min-height: 18px; }
    .asw-live .lang-toggle { margin-left: auto; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .asw-live .flow-connector.done { background: var(--accent); }
    .asw-live .flow-connector.running {
      background: linear-gradient(to bottom, var(--accent) 0%, var(--accent) 45%, var(--border) 100%);
    }
    .asw-live .flow-connector.skipped { background: repeating-linear-gradient(to bottom, var(--s2) 0 4px, transparent 4px 8px); opacity: .6; }
    .asw-live .flow-connector.pending { background: var(--border); opacity: .5; }
    @keyframes pulse { 50% { opacity: .4; } }
    .asw-live .annotation { background: var(--primary); color: #fff; padding: 16px 20px; border-radius: 8px; margin-bottom: 20px; font-size: 15px; line-height: 1.55; }
    .asw-live .annotation small { display: block; margin-top: 8px; opacity: .75; font-size: 12px; }
    .asw-live .step { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; }
    .asw-live .step.in_progress { border-color: var(--accent); background: #f8fffc; }
    .asw-live .step.completed { opacity: .85; }
    .asw-live .step.pending { opacity: .5; }
    .asw-live .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; color: #fff; }
    .asw-live .badge-S0{background:var(--s0)} .asw-live .badge-S1{background:var(--s1)}
    .asw-live .badge-S2{background:var(--s2)} .asw-live .badge-S3{background:var(--s3)} .asw-live .badge-S4{background:var(--s4)}
    .asw-live .status-pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--surface-soft); color: var(--body); }
    .asw-live .finding { padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; }
    .asw-live .event-log { font-family: ui-monospace, monospace; font-size: 11px; max-height: 200px; overflow-y: auto; color: var(--body); }
    .asw-live .event-log div { padding: 4px 0; border-bottom: 1px solid var(--border); }
    .asw-live .toolbar { padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .asw-live .toolbar-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
    .asw-live .toolbar-row:last-child { margin-bottom: 0; }
    .asw-live .toolbar label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); flex: 1; min-width: 220px; }
    .asw-live .toolbar input[type=text],
    .asw-live .toolbar input[type=url],
    .asw-live .url-entry input[type=url] { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    .asw-live .url-entry {
      padding: 16px 24px; background: var(--surface); border-bottom: 2px solid var(--accent);
      display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
    }
    .asw-live .url-entry .url-entry-field { flex: 1; min-width: min(100%, 320px); display: flex; flex-direction: column; gap: 6px; }
    .asw-live .url-entry .field-label { font-size: 12px; font-weight: 700; color: var(--primary); letter-spacing: .02em; }
    .asw-live .url-entry-input {
      width: 100%; padding: 12px 14px; font-size: 16px; line-height: 1.4;
      border: 2px solid var(--border); border-radius: 8px; background: #fff;
    }
    .asw-live .url-entry-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(18,50,74,.1); }
    .asw-live .url-entry-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-bottom: 2px; }
    .asw-live .paste-hero { max-width: 520px; margin: 0 auto; padding: 24px; text-align: center; }
    .asw-live .paste-hero-title { font-size: 18px; font-weight: 600; color: #e2e8f0; margin: 0 0 16px; }
    .asw-live .paste-hero-input {
      width: 100%; padding: 14px 16px; font-size: 16px; border: 2px solid #475569; border-radius: 8px;
      background: #1e293b; color: #f8fafc; margin-bottom: 12px;
    }
    .asw-live .paste-hero-input::placeholder { color: #94a3b8; }
    .asw-live .paste-hero-input:focus { border-color: var(--accent); outline: none; }
    .asw-live .paste-hero-btn { font-size: 15px; padding: 10px 24px; }
    .asw-live .paste-hero-hint { font-size: 12px; color: #64748b; margin: 14px 0 0; }
    .asw-live .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-bottom: 2px; }
    .asw-live .feed-status { font-size: 12px; padding: 6px 10px; border-radius: 6px; background: var(--surface-soft); color: var(--body); min-width: 140px; }
    .asw-live .feed-status.ok { background: var(--accent-soft); color: #1a4d3e; }
    .asw-live .feed-status.err { background: #fef3f2; color: #7a1e1e; }
    .asw-live .quick-links a { display: block; font-size: 13px; margin-bottom: 8px; color: var(--primary); word-break: break-all; }
    .asw-live header a.target-link { color: #b8d4e8; cursor: pointer; text-decoration: underline; }
    .asw-live .hint-inline { font-size: 12px; color: var(--muted); margin: 0 24px 8px; }
    .asw-live .asw-btn { background: var(--primary); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .asw-live .asw-btn:hover { background: var(--primary-active); }
    .asw-live .asw-btn.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
    .asw-live .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 6px; animation: pulse 1.5s infinite; }
    .asw-live .setup-banner { display: none; margin: 0; padding: 12px 24px; background: #fef3f2; border-bottom: 1px solid #fecdca; color: #7a1e1e; font-size: 13px; line-height: 1.5; }
    .asw-live .setup-banner.visible { display: block; }
    .asw-live .setup-banner code { background: #fff; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body class="asw-live">
  <div class="setup-banner" id="setupBanner"></div>
  <header>
    <h1 style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span><span class="live-dot" id="liveIndicator"></span> <span data-i18n="title">AgentSkills Live Audit</span></span>
      <button type="button" class="lang-toggle" id="langToggle" title="Language">EN</button>
    </h1>
    <div class="meta">
      <span><span data-i18n="auditedSite">被审站点</span>：<a class="target-link" id="targetUrlLink" href="#" target="_blank" rel="noopener">—</a></span>
      <span id="progressLabel">—</span>
      <span id="runStatus">—</span>
      <span id="updatedAt">—</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </header>
  <section class="url-entry" id="urlEntry" aria-label="Target URL">
    <div class="url-entry-field">
      <span class="field-label" data-i18n="labelUrl">① 被审网站链接</span>
      <input type="url" id="targetSiteUrl" class="url-entry-input" data-i18n-placeholder="placeholderUrl"
        placeholder="https://your-site.com/" autocomplete="url" inputmode="url" />
    </div>
    <div class="url-entry-actions">
      <button type="button" class="asw-btn" id="btnApplyUrl" data-i18n="btnApplyUrl">应用链接</button>
      <button type="button" class="asw-btn secondary" id="btnOpenTarget" data-i18n="btnOpenTarget">新标签页打开</button>
      <button type="button" class="asw-btn secondary" id="btnCopyAudit" data-i18n="btnCopyAudit">复制 /audit 命令</button>
      <button type="button" class="asw-btn secondary" id="btnLoadBarrierlens" data-i18n="btnBarrierlens">BarrierLens 快照</button>
    </div>
  </section>
  <p class="url-toast" id="urlToast" aria-live="polite"></p>
  <div class="toolbar">
    <p class="hint-inline" data-i18n="hintLayout" style="margin:0 0 10px">三栏同屏说明</p>
    <div class="toolbar-row">
      <label class="field">
        <span class="field-label" data-i18n="labelState">② 实时数据源</span>
        <input type="text" id="statePath" placeholder="data/barrierlens-run-state.json" />
      </label>
      <div class="toolbar-actions">
        <button type="button" class="asw-btn" id="btnLoad" data-i18n="btnConnect">连接 / 刷新</button>
        <button type="button" class="asw-btn secondary" id="btnDemo" data-i18n="btnDemo">演示流程动画</button>
        <label style="flex-direction:row;align-items:center;min-width:auto;font-size:13px;color:var(--body)">
          <input type="checkbox" id="pollEnabled" checked /> <span data-i18n="poll">自动轮询</span>
        </label>
        <span class="feed-status" id="feedStatus">未连接</span>
      </div>
    </div>
  </div>
  <main class="split-main">
    <aside>
      <h2 data-i18n="railFlow">审计流程</h2>
      <div class="flow-pipeline" id="stageRail"></div>
    </aside>
    <div class="center-site" id="centerSite">
      <div class="caption-bar" id="captionBar">
        <strong>实时旁白（正在检查什么）</strong>
        <div class="caption-text" id="captionText">连接数据源后显示；粘贴链接后中间加载被审网站</div>
      </div>
      <iframe id="targetPreview" title="被审网站" hidden></iframe>
      <div class="site-placeholder" id="sitePlaceholder">
        <div class="paste-hero">
          <p class="paste-hero-title" data-i18n="pasteHeroTitle">在此粘贴要验收的网站链接</p>
          <input type="url" id="centerPasteUrl" class="paste-hero-input" data-i18n-placeholder="placeholderUrl"
            placeholder="https://your-site.com/" autocomplete="url" inputmode="url" aria-label="Target URL" />
          <button type="button" class="asw-btn paste-hero-btn" id="btnApplyUrlCenter" data-i18n="btnApplyUrl">应用链接</button>
          <p class="paste-hero-hint" data-i18n="pasteHeroHint">也可在页面顶部输入框粘贴</p>
        </div>
      </div>
    </div>
    <div class="rail-right">
      <h2 data-i18n="railSteps">当前步骤</h2>
      <h3 id="currentStageTitle" style="margin:0 0 12px;font-size:15px;color:var(--ink)">—</h3>
      <div class="annotation" id="annotationBox" style="font-size:13px;padding:12px">
        等待加载…
        <small>与顶栏同步</small>
      </div>
      <div id="stepList"></div>
      <h2 data-i18n="railFindings">已发现问题</h2>
      <div id="findingsList"></div>
      <h2 data-i18n="railLinks">链接与扩展</h2>
      <div class="quick-links" id="quickLinks"></div>
      <h2 data-i18n="railEvents">事件流</h2>
      <div class="event-log" id="eventLog"></div>
    </div>
  </main>
  <script src="i18n.js"></script>
  <script src="embedded-barrierlens-run-state.js"></script>
  <script src="embedded-demo-run-state.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let lang = localStorage.getItem('asw-live-lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');
    function t(key) { return (window.ASW_I18N[lang] && window.ASW_I18N[lang][key]) || key; }
    function tFmt(key, vars) {
      let s = t(key);
      if (vars) Object.keys(vars).forEach((k) => { s = s.replace('{' + k + '}', vars[k]); });
      return s;
    }
    function stageLabel(st) {
      const m = window.ASW_I18N[lang]?.stages;
      return (m && m[st.id]) || st.label || st.id;
    }
    function progressLabel(state, stage) {
      const cur = state.progress?.current ?? 1;
      const total = state.progress?.total ?? (state.stages?.length || 9);
      const name = stage ? stageLabel(stage) : '';
      return tFmt('progressOf', { cur: String(cur), total: String(total), stage: name });
    }
    function applyLang() {
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const k = el.getAttribute('data-i18n');
        if (!k) return;
        if (el.querySelector('input, textarea, select, button.asw-btn')) return;
        el.textContent = t(k);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
        el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
      });
      $('langToggle').textContent = lang === 'zh' ? 'EN' : '中文';
    }
    $('langToggle').onclick = () => {
      lang = lang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('asw-live-lang', lang);
      applyLang();
      if (lastRenderedState) render(lastRenderedState);
    };
    let lastRenderedState = null;
    let previewLocked = false;
    applyLang();
    let pollTimer = null;
    let demoTimer = null;
    let eventsPath = null;
    let detectedDataBase = null;

    const REPO_PREFIXES = ['', 'agentskills-audit-collection/'];
    const GOLDEN_FALLBACKS = {
      'validation/artifacts/20260524T055013Z-9936/run-state.json': 'data/barrierlens-run-state.json',
      'validation/golden/barrierlens-run-state.json': 'data/barrierlens-run-state.json',
      'validation/golden/audit-run.example.json': 'data/demo-run-state.json',
    };
    const EMBEDDED_BY_PATH = {
      'data/barrierlens-run-state.json': () => window.ASW_EMBEDDED_BARRIERLENS_RUN_STATE,
      'data/demo-run-state.json': () => window.ASW_EMBEDDED_DEMO_RUN_STATE,
    };

    const params = new URLSearchParams(location.search);
    if (params.get('lang') === 'en' || params.get('lang') === 'zh') {
      lang = params.get('lang');
      localStorage.setItem('asw-live-lang', lang);
      applyLang();
    }
    if (params.get('state')) $('statePath').value = decodeURIComponent(params.get('state'));
    if (params.get('demo') === '1') $('statePath').value = 'data/demo-run-state.json';
    if (params.get('barrierlens') === '1') $('statePath').value = 'data/barrierlens-run-state.json';

    function normalizeUrl(raw) {
      const s = (raw || '').trim();
      if (!s) return '';
      if (/^https?:\/\//i.test(s)) return s;
      return 'https://' + s;
    }

    function readTargetUrlRaw() {
      const top = ($('targetSiteUrl')?.value || '').trim();
      const center = ($('centerPasteUrl')?.value || '').trim();
      return top || center;
    }

    function writeTargetUrlRaw(value) {
      const v = value || '';
      if ($('targetSiteUrl')) $('targetSiteUrl').value = v;
      if ($('centerPasteUrl')) $('centerPasteUrl').value = v;
    }

    function bindUrlInputs() {
      ['targetSiteUrl', 'centerPasteUrl'].forEach((id) => {
        const el = $(id);
        if (!el) return;
        el.addEventListener('input', () => writeTargetUrlRaw(el.value));
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); applyTargetUrl(); }
        });
      });
    }
    bindUrlInputs();
    if (params.get('url')) writeTargetUrlRaw(decodeURIComponent(params.get('url')));

    function setFeedStatus(ok, text) {
      const el = $('feedStatus');
      el.textContent = text;
      el.className = ok ? 'feed-status ok' : 'feed-status err';
    }

    function isPreviewState(state) {
      return String(state?.runId || '').startsWith('preview-');
    }

    function buildPreviewState(url) {
      const raw = window.ASW_EMBEDDED_DEMO_RUN_STATE;
      const base = raw ? JSON.parse(JSON.stringify(raw)) : { stages: [] };
      const u = normalizeUrl(url);
      let label = u;
      try { label = new URL(u).hostname; } catch (_) {}
      base.runId = 'preview-' + Date.now();
      base.target = { url: u, label };
      base.status = 'running';
      base.findingsPreview = [];
      base.reportPath = null;
      base.eventsPath = null;
      base.updatedAt = new Date().toISOString();
      base.currentStageId = 'intake';
      base.currentStepId = 'target';
      base.activeAnnotation = t('captionWaiting');
      const total = base.stages?.length || 9;
      base.progress = { current: 1, total, label: progressLabel(base, base.stages?.[0]) };
      (base.stages || []).forEach((st, i) => {
        st.status = i === 0 ? 'in_progress' : 'pending';
        (st.steps || []).forEach((step, j) => {
          step.status = i === 0 && j === 0 ? 'in_progress' : 'pending';
        });
      });
      return base;
    }

    function applyTargetUrl() {
      const u = normalizeUrl(readTargetUrlRaw());
      if (!u) {
        $('urlToast').textContent = t('needUrl');
        $('targetSiteUrl')?.focus();
        return;
      }
      writeTargetUrlRaw(u);
      stopDemo();
      previewLocked = true;
      const preview = buildPreviewState(u);
      lastRenderedState = preview;
      render(preview);
      $('urlToast').textContent = t('siteLoaded') + ' · ' + t('previewMode');
    }

    function updateQuickLinks(state) {
      const box = $('quickLinks');
      const target = normalizeUrl(readTargetUrlRaw()) || state?.target?.url || '';
      const origin = window.location.origin;
      const statePath = $('statePath').value.trim();
      const stateHttp = statePath ? origin + '/' + statePath.replace(/^\//, '').split('/').map(encodeURIComponent).join('/') : '';
      // fix: encodeURIComponent per segment breaks paths - use simpler join
      const stateHttpSimple = statePath ? (origin + '/' + statePath.replace(/^\//, '')) : '';

      let html = '';
      if (target) {
        html += '<a href="#" id="qlOpenNewTab">' + escapeHtml(t('qlOpenNewTab')) + '</a>';
        html += '<a href="#" id="qlPreviewInline">' + escapeHtml(t('qlPreview')) + '</a>';
      }
      if (state?.reportPath) {
        const rp = state.reportPath.startsWith('http') ? state.reportPath : (origin + '/' + state.reportPath.replace(/^\//, ''));
        html += '<a href="' + escapeHtml(rp) + '" target="_blank" rel="noopener">' + escapeHtml(t('qlReport')) + '</a>';
      }
      if (stateHttpSimple) {
        html += '<span style="font-size:11px;color:var(--muted)">' + escapeHtml(t('qlStateUrl')) + ':</span>';
        html += '<code style="font-size:10px;word-break:break-all;display:block;margin:4px 0 10px">' + escapeHtml(stateHttpSimple) + '</code>';
      }
      html += '<span style="font-size:11px;color:var(--muted)">' + escapeHtml(t('qlExtHint')) + '</span>';
      box.innerHTML = html || '<p style="color:var(--muted);font-size:12px">' + escapeHtml(t('qlEmpty')) + '</p>';
      const qlNew = document.getElementById('qlOpenNewTab');
      const qlPrev = document.getElementById('qlPreviewInline');
      if (qlNew) qlNew.onclick = (e) => { e.preventDefault(); openInNewTab(target); };
      if (qlPrev) qlPrev.onclick = (e) => { e.preventDefault(); loadCenterIframe(); };
    }

    function openInNewTab(url) {
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function syncTargetFromState(state) {
      if (state?.target?.url) {
        writeTargetUrlRaw(state.target.url);
        const link = $('targetUrlLink');
        link.textContent = state.target.label || state.target.url;
        link.dataset.url = state.target.url;
      }
    }

    $('targetUrlLink').addEventListener('click', (e) => {
      e.preventDefault();
      const u = normalizeUrl($('targetUrlLink').dataset.url || readTargetUrlRaw());
      if (!u) return;
      openInNewTab(u);
    });

    function loadCenterIframe() {
      const u = normalizeUrl(readTargetUrlRaw());
      const frame = $('targetPreview');
      const ph = $('sitePlaceholder');
      if (!u) {
        frame.hidden = true;
        frame.src = 'about:blank';
        ph.hidden = false;
        return;
      }
      ph.hidden = true;
      frame.hidden = false;
      frame.src = u;
    }

    function updateCaption(state) {
      const bar = $('captionBar');
      const label = bar.querySelector('strong');
      const text = $('captionText');
      if (!state) {
        text.textContent = t('captionEmpty');
        bar.classList.remove('snapshot');
        if (label) label.textContent = t('captionLabel');
        return;
      }
      const preview = isPreviewState(state);
      text.textContent = state.activeAnnotation || (preview ? t('captionWaiting') : t('captionEmpty'));
      const snap = state.status === 'completed' && !preview;
      bar.classList.toggle('snapshot', snap);
      if (label) {
        label.textContent = snap ? t('captionSnapshot') : t('captionLabel') + (preview ? ' · ' + t('previewMode') : '');
      }
    }

    $('btnApplyUrl').onclick = () => applyTargetUrl();
    $('btnApplyUrlCenter').onclick = () => applyTargetUrl();

    $('btnOpenTarget').onclick = () => {
      const u = normalizeUrl(readTargetUrlRaw());
      if (!u) { alert(t('needUrl')); return; }
      openInNewTab(u);
    };

    $('btnCopyAudit').onclick = () => {
      const u = normalizeUrl(readTargetUrlRaw());
      const cmd = u
        ? 'Use /audit to review ' + u + ' before launch. Update validation/artifacts/<runId>/run-state.json after each stage (live-run-protocol).'
        : 'Use /audit on <URL>. Run ./scripts/audit-run-init.sh "<URL>" first.';
      navigator.clipboard.writeText(cmd).then(() => alert(t('copied'))).catch(() => prompt(t('copied'), cmd));
    };

    $('btnLoadBarrierlens').onclick = () => {
      writeTargetUrlRaw('https://barrierlens.vercel.app/');
      $('statePath').value = 'data/barrierlens-run-state.json';
      previewLocked = false;
      stopDemo();
      loadState();
      startPoll();
    };

    function showSetupBanner(html) {
      const b = $('setupBanner');
      b.innerHTML = html;
      b.classList.add('visible');
    }
    function hideSetupBanner() {
      $('setupBanner').classList.remove('visible');
      $('setupBanner').innerHTML = '';
    }

    function pageRelativeUrl(rel) {
      return new URL(rel.replace(/^\//, ''), new URL('.', window.location.href)).href;
    }

    function statePathCandidates(path) {
      const p = path.replace(/^\//, '');
      const set = new Set();
      const add = (x) => { if (x) set.add(x.replace(/^\//, '')); };

      add(p);
      if (GOLDEN_FALLBACKS[p]) add(GOLDEN_FALLBACKS[p]);
      if (p.startsWith('validation/')) add('data/' + (p.includes('barrierlens') ? 'barrierlens-run-state.json' : p.includes('audit-run') ? 'demo-run-state.json' : ''));

      add('data/barrierlens-run-state.json');
      add('data/demo-run-state.json');

      REPO_PREFIXES.forEach((pre) => {
        [...set].forEach((item) => add(pre + item));
        add(pre + 'workbench/live/data/barrierlens-run-state.json');
        add(pre + 'validation/golden/barrierlens-run-state.json');
      });

      return [...set].filter(Boolean);
    }

    async function probeUrl(url) {
      try {
        const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now());
        return r.ok;
      } catch {
        return false;
      }
    }

    async function detectDataBase() {
      if (detectedDataBase !== null) return detectedDataBase;
      const rel = pageRelativeUrl('data/barrierlens-run-state.json');
      if (await probeUrl(rel)) {
        detectedDataBase = 'page-relative';
        return detectedDataBase;
      }
      for (const pre of REPO_PREFIXES) {
        const u = pageRelativeUrl(pre + 'workbench/live/data/barrierlens-run-state.json');
        if (await probeUrl(u)) {
          detectedDataBase = pre;
          return detectedDataBase;
        }
      }
      detectedDataBase = '';
      return detectedDataBase;
    }

    function embeddedState(path) {
      const key = path.replace(/^\//, '');
      const fn = EMBEDDED_BY_PATH[key];
      if (!fn) return null;
      const state = fn();
      return state && typeof state === 'object' ? state : null;
    }

    async function fetchStateJson(path) {
      const tries = statePathCandidates(path);
      const seen = new Set();
      let lastErr = null;

      await detectDataBase();

      for (let rel of tries) {
        const urls = [rel];
        if (!rel.startsWith('http')) urls.unshift(pageRelativeUrl(rel));
        for (const url of urls) {
          if (seen.has(url)) continue;
          seen.add(url);
          try {
            const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now());
            if (!r.ok) { lastErr = new Error(url + ' → HTTP ' + r.status); continue; }
            return { state: await r.json(), resolvedPath: rel };
          } catch (e) {
            lastErr = e;
          }
        }
      }

      const emb = embeddedState(path) || embeddedState(GOLDEN_FALLBACKS[path.replace(/^\//, '')] || '');
      if (emb) {
        return { state: emb, resolvedPath: path + ' (embedded)' };
      }

      throw lastErr || new Error('无法加载 run-state');
    }

    function stageClass(s) {
      if (s.status === 'completed') return 'done';
      if (s.status === 'skipped') return 'skipped';
      if (s.status === 'blocked') return 'blocked';
      if (s.status === 'in_progress') return 'running';
      return 'pending';
    }

    function stageIcon(st) {
      if (st.status === 'completed') return '✓';
      if (st.status === 'skipped') return '—';
      if (st.status === 'blocked') return '!';
      if (st.status === 'in_progress') return '●';
      return String(st.order || '·');
    }

    function connectorClass(fromStage) {
      if (fromStage.status === 'completed') return 'done';
      if (fromStage.status === 'in_progress') return 'running';
      if (fromStage.status === 'skipped') return 'skipped';
      return 'pending';
    }

    function stepClass(s) {
      if (s.status === 'in_progress') return 'in_progress';
      if (s.status === 'completed' || s.status === 'issue_found') return 'completed';
      return 'pending';
    }

    function render(state) {
      lastRenderedState = state;
      syncTargetFromState(state);
      updateQuickLinks(state);
      updateCaption(state);
      loadCenterIframe();
      const curStage = (state.stages || []).find((s) => s.id === state.currentStageId);
      $('progressLabel').textContent = state.progress?.label || (curStage ? progressLabel(state, curStage) : '—');
      $('runStatus').textContent = t('statusPrefix') + ': ' + (state.status || '—');
      $('updatedAt').textContent = t('updatedPrefix') + ': ' + (state.updatedAt || '—');
      const pct = state.progress ? Math.round((state.progress.current / state.progress.total) * 100) : 0;
      $('progressFill').style.width = pct + '%';

      eventsPath = state.eventsPath || null;

      const rail = $('stageRail');
      rail.innerHTML = '';
      const stages = state.stages || [];
      stages.forEach((st, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'flow-step-wrap';
        const node = document.createElement('div');
        const cls = stageClass(st);
        node.className = 'flow-node ' + cls + (st.id === state.currentStageId ? ' active' : '');
        node.innerHTML =
          '<span class="node-circle" title="' + escapeHtml(st.status) + '">' + stageIcon(st) + '</span>' +
          '<div class="node-label"><strong>' + escapeHtml(stageLabel(st)) + '</strong>' +
          '<span class="status-pill">' + escapeHtml(st.status) + '</span></div>';
        wrap.appendChild(node);
        if (i < stages.length - 1) {
          const conn = document.createElement('div');
          conn.className = 'flow-connector ' + connectorClass(st);
          conn.setAttribute('aria-hidden', 'true');
          wrap.appendChild(conn);
        }
        rail.appendChild(wrap);
      });

      const cur = (state.stages || []).find((s) => s.id === state.currentStageId) || state.stages?.[0];
      $('currentStageTitle').textContent = cur ? stageLabel(cur) : '—';
      $('annotationBox').innerHTML = escapeHtml(state.activeAnnotation || '—') +
        '<small>' + (state.currentStepId ? 'step: ' + state.currentStepId : '') + '</small>';

      const steps = $('stepList');
      steps.innerHTML = '';
      (cur?.steps || []).forEach((step) => {
        const row = document.createElement('div');
        row.className = 'step ' + stepClass(step);
        row.innerHTML = '<div style="flex:1"><strong>' + escapeHtml(step.label) + '</strong>' +
          (step.annotation ? '<br><span style="color:var(--muted)">' + escapeHtml(step.annotation) + '</span>' : '') +
          '</div><span class="status-pill">' + step.status + '</span>' +
          (step.evidenceLevel ? ' <span class="status-pill">' + step.evidenceLevel + '</span>' : '');
        steps.appendChild(row);
      });

      const findings = $('findingsList');
      findings.innerHTML = '';
      if (!(state.findingsPreview || []).length) {
        findings.innerHTML = '<p style="color:var(--muted)">' + escapeHtml(t('noFindings')) + '</p>';
      } else {
        state.findingsPreview.forEach((f) => {
          const d = document.createElement('div');
          d.className = 'finding';
          d.innerHTML = '<span class="badge badge-' + f.severity + '">' + f.severity + '</span> ' + escapeHtml(f.title);
          findings.appendChild(d);
        });
      }
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    async function loadEvents() {
      if (!eventsPath) return;
      try {
        const r = await fetch(eventsPath + '?t=' + Date.now());
        if (!r.ok) return;
        const text = await r.text();
        const lines = text.trim().split('\n').filter(Boolean);
        const tail = lines.slice(-12);
        const log = $('eventLog');
        log.innerHTML = tail.map((line) => {
          try {
            const o = JSON.parse(line);
            return '<div><span style="color:var(--muted)">' + (o.ts || '') + '</span> ' +
              escapeHtml(o.type) + (o.annotation ? ': ' + escapeHtml(o.annotation) : '') + '</div>';
          } catch { return '<div>' + escapeHtml(line) + '</div>'; }
        }).join('');
      } catch (_) {}
    }

    async function loadState() {
      const path = $('statePath').value.trim();
      if (!path) {
        showSetupBanner(
          '未设置 run-state 路径。请先运行 <code>cd agentskills-audit-collection && python3 -m http.server 8765</code>，' +
          '再打开 <code>http://127.0.0.1:8765/workbench/live/?demo=1</code> 或点「演示模式」。'
        );
        return;
      }
      try {
        const { state, resolvedPath } = await fetchStateJson(path);
        if (resolvedPath !== path) $('statePath').value = resolvedPath;
        hideSetupBanner();
        const userUrl = normalizeUrl(readTargetUrlRaw());
        const stateUrl = normalizeUrl(state.target?.url || '');
        if (userUrl && stateUrl && userUrl !== stateUrl) {
          $('urlToast').textContent = t('urlMismatch');
          if (previewLocked) {
            loadCenterIframe();
            const mode = t('previewMode');
            setFeedStatus(true, mode + ' · ' + new Date().toLocaleTimeString());
            return;
          }
        } else {
          previewLocked = false;
          if (!userUrl && stateUrl) writeTargetUrlRaw(stateUrl);
          if (!isPreviewState(state)) $('urlToast').textContent = '';
        }
        render(state);
        await loadEvents();
        $('liveIndicator').style.background = state.status === 'running' ? '#22c55e' : '#94a3b8';
        const mode = state.status === 'running' ? t('connectedRunning') : (state.status === 'completed' ? t('connectedDone') : state.status);
        setFeedStatus(true, mode + ' · ' + new Date().toLocaleTimeString());
      } catch (e) {
        const altBase = location.pathname.includes('agentskills-audit-collection')
          ? ''
          : '/agentskills-audit-collection';
        const altLive = altBase + '/workbench/live/?barrierlens=1';
        showSetupBanner(
          '无法通过 HTTP 加载 <code>' + escapeHtml(path) + '</code>（' + escapeHtml(String(e.message || e)) + '）。' +
          '请在本仓库根目录运行 <code>./scripts/serve-workbench.sh</code>（会自动停掉错误的 8765 进程）。' +
          (altBase
            ? ' 若 workspace 在上级 <strong>cursorskils</strong>，请改用：<a href="' + altLive + '">' + altLive + '</a>'
            : '') +
          ' 或刷新本页（已内置 embedded 数据，应能离线显示）。'
        );
        $('annotationBox').innerHTML = '看板未连上数据 — 请按顶部红条说明操作，或点「演示模式」先确认页面正常。';
        $('liveIndicator').style.background = '#b42318';
        setFeedStatus(false, t('feedDisconnected') + ' · ' + new Date().toLocaleTimeString());
        updateQuickLinks(null);
      }
    }

    function startPoll() {
      stopPoll();
      if ($('pollEnabled').checked) {
        pollTimer = setInterval(loadState, 1000);
      }
    }
    function stopPoll() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

    let demoState = null;
    let demoStageIndex = 0;

    function advanceDemoTick() {
      if (!demoState?.stages?.length) return;
      const stages = demoState.stages;
      if (demoStageIndex >= stages.length) {
        stopDemo();
        demoState.status = 'completed';
        stages.forEach((s) => { s.status = 'completed'; (s.steps || []).forEach((step) => { step.status = 'completed'; }); });
        demoState.activeAnnotation = lang === 'zh' ? '演示完成 — 连接真实 run-state 可看快照' : 'Demo complete — connect a real run-state for snapshots';
        demoState.progress.current = stages.length;
        demoState.progress.label = progressLabel(demoState, stages[stages.length - 1]);
        render(demoState);
        return;
      }
      stages.forEach((s, i) => {
        if (i < demoStageIndex) {
          s.status = 'completed';
          (s.steps || []).forEach((step) => { step.status = 'completed'; });
        } else if (i === demoStageIndex) {
          s.status = 'in_progress';
          (s.steps || []).forEach((step, j) => { step.status = j === 0 ? 'in_progress' : 'pending'; });
        } else {
          s.status = 'pending';
          (s.steps || []).forEach((step) => { step.status = 'pending'; });
        }
      });
      const st = stages[demoStageIndex];
      demoState.currentStageId = st.id;
      demoState.currentStepId = st.steps?.[0]?.id || null;
      demoState.progress.current = demoStageIndex + 1;
      demoState.progress.label = progressLabel(demoState, st);
      demoState.activeAnnotation = t('demoStage') + ': ' + stageLabel(st);
      demoState.status = 'running';
      demoState.updatedAt = new Date().toISOString();
      render(demoState);
      demoStageIndex++;
    }

    async function runDemo() {
      stopDemo();
      previewLocked = false;
      const loaded = await fetchStateJson('data/demo-run-state.json');
      demoState = JSON.parse(JSON.stringify(loaded.state));
      $('statePath').value = loaded.resolvedPath;
      if (demoState.target?.url) writeTargetUrlRaw(demoState.target.url);
      eventsPath = demoState.eventsPath || 'validation/golden/audit-run-events.example.ndjson';
      demoStageIndex = 0;
      demoState.status = 'running';
      demoState.findingsPreview = [];
      stagesResetForDemo();
      advanceDemoTick();
      loadEvents();
      demoTimer = setInterval(advanceDemoTick, 1600);
    }

    function stagesResetForDemo() {
      (demoState.stages || []).forEach((s) => {
        s.status = 'pending';
        (s.steps || []).forEach((step) => { step.status = 'pending'; });
      });
    }
    function stopDemo() { if (demoTimer) clearInterval(demoTimer); demoTimer = null; }

    $('btnLoad').onclick = () => { stopDemo(); previewLocked = false; loadState(); startPoll(); };
    $('btnDemo').onclick = () => { stopPoll(); runDemo(); };
    $('pollEnabled').onchange = () => { stopDemo(); startPoll(); loadState(); };

    if (!params.get('state') && params.get('demo') !== '1' && params.get('barrierlens') !== '1' && !$('statePath').value.trim()) {
      $('statePath').value = 'data/demo-run-state.json';
    }

    loadState();
    startPoll();
    if (params.get('url')) applyTargetUrl();
  </script>
</body>
</html>
