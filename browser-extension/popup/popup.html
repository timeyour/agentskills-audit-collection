<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AgentSkills Audit</title>
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; margin: 0; padding: 12px; width: 320px; color: #17202a; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #667085; margin: 10px 0 4px; }
    input[type=text] { width: 100%; padding: 8px; border: 1px solid #d8e0e7; border-radius: 6px; box-sizing: border-box; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    button { background: #12324a; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; }
    button.secondary { background: #fff; color: #17202a; border: 1px solid #d8e0e7; }
    .hint { font-size: 11px; color: #667085; margin-top: 8px; line-height: 1.45; }
    .status { margin-top: 10px; padding: 8px; background: #eef3f7; border-radius: 6px; font-size: 12px; }
    a { color: #12324a; }
    details.advanced { margin-top: 10px; border-top: 1px solid #d8e0e7; padding-top: 8px; }
    details.advanced summary { cursor: pointer; font-weight: 600; font-size: 12px; margin-bottom: 8px; }
    select { width: 100%; padding: 6px; border: 1px solid #d8e0e7; border-radius: 6px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>AgentSkills 审计伴侣</h1>
  <label for="stateUrl">run-state.json URL</label>
  <input id="stateUrl" type="text" placeholder="http://127.0.0.1:8765/validation/artifacts/…/run-state.json" />
  <label for="relayUrl">证据 relay（可选）</label>
  <input id="relayUrl" type="text" placeholder="http://127.0.0.1:8766" />
  <div class="row">
    <label><input type="checkbox" id="overlayEnabled" checked /> 页面内旁白</label>
  </div>
  <details class="advanced" id="narrationPanel">
    <summary>可选 · 第二模型（仅旁白翻译/摘要）</summary>
    <label><input type="checkbox" id="narrationEnabled" /> 启用</label>
    <label for="narrationMode">模式</label>
    <select id="narrationMode">
      <option value="passthrough">透传（默认）</option>
      <option value="relay">经 relay（推荐，密钥在终端 env）</option>
      <option value="direct">扩展直连 API</option>
    </select>
    <label for="narrationTask">任务</label>
    <select id="narrationTask">
      <option value="none">无</option>
      <option value="translate">翻译旁白</option>
      <option value="summarize">摘要旁白</option>
    </select>
    <label for="targetLocale">目标语言</label>
    <input id="targetLocale" type="text" placeholder="zh" />
    <label for="directEndpoint">直连 endpoint（仅 direct）</label>
    <input id="directEndpoint" type="text" placeholder="https://api.openai.com/v1/chat/completions" />
    <label for="directModel">直连 model</label>
    <input id="directModel" type="text" placeholder="gpt-4o-mini" />
    <label for="directApiKey">直连 API Key（仅存本机）</label>
    <input id="directApiKey" type="password" placeholder="sk-…" autocomplete="off" />
    <p class="hint">审计编排仍在 IDE；relay 配置见 <code>docs/extension-optional-llm.md</code></p>
  </details>
  <div class="row">
    <button type="button" id="save">保存</button>
    <button type="button" class="secondary" id="openWorkbench">Live 看板</button>
  </div>
  <div class="status" id="status">—</div>
  <p class="hint">
    1. 仓库根目录：<code>python3 -m http.server 8765</code><br>
    2. 可选：<code>python3 scripts/browser-relay.py</code>（8766，保存截图到 artifacts）<br>
    3. <code>./scripts/audit-run-init.sh URL</code> 后粘贴打印的 STATE_URL<br>
    审计规则仍在 <code>/audit</code> Skills，扩展只读旁白 + 留证。
  </p>
  <script src="popup.js"></script>
</body>
</html>
